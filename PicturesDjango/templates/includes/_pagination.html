{% load i18n %}
{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="{% trans 'Page navigation' %}">
  <ul class="pagination">
    {% if page_obj.has_previous %}
    <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}" aria-label="{% trans 'Previous page' %}">‹</a></li>
    {% endif %}
    {% for num in page_obj.paginator.page_range %}
    <li class="page-item {% if page_obj.number == num %}active{% endif %}">
      <a class="page-link" href="?page={{ num }}" {% if page_obj.number == num %}aria-current="page"{% endif %}>{{ num }}</a>
    </li>
    {% endfor %}
    {% if page_obj.has_next %}
    <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}" aria-label="{% trans 'Next page' %}">›</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
