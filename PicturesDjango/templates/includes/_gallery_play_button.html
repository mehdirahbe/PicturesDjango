{% load i18n %}
<button class="viewer-tool viewer-tool--play" type="button"
        data-gallery-play
        data-play-label="{% trans 'Play slideshow' %}"
        data-pause-label="{% trans 'Pause slideshow' %}"
        aria-pressed="false"
        aria-label="{% trans 'Play slideshow' %}"
        {% if photos.paginator.num_pages < 2 %}disabled{% endif %}>
  <svg data-icon-play viewBox="0 0 24 24" aria-hidden="true">
    <path d="M8 5.14v13.72L19 12 8 5.14z" fill="currentColor" stroke="none"></path>
  </svg>
  <svg data-icon-pause viewBox="0 0 24 24" aria-hidden="true" hidden>
    <rect x="6.5" y="5" width="3.5" height="14" rx="0.6" fill="currentColor" stroke="none"></rect>
    <rect x="14" y="5" width="3.5" height="14" rx="0.6" fill="currentColor" stroke="none"></rect>
  </svg>
  <span data-label-play>{% trans 'Play' %}</span>
  <span data-label-pause hidden>{% trans 'Pause' %}</span>
</button>
